[project]
name = "repl-nix-workspace"
version = "0.1.0"
description = "Tutorial Builder — FastAPI backend for Vercel"
requires-python = ">=3.11"
dependencies = [
    "aiofiles>=25.1.0",
    "fastapi>=0.135.2",
    "jinja2>=3.1.6",
    "openai>=2.30.0",
    "pydantic-settings>=2.13.1",
    "python-dotenv>=1.2.2",
    "sqlalchemy>=2.0.48",
    "psycopg[binary]>=3.2.0",
    "anthropic>=0.40.0",
    "python-docx>=1.1.0",
    "uvicorn[standard]>=0.42.0",
]

[tool.vercel]
# Root main.py re-exports app; explicit entrypoint for Vercel's detector.
entrypoint = "main:app"
